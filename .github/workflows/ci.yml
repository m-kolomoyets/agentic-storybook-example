name: CI

on:
    push:
        branches: [main]
    pull_request:
    # Started by the template update job on its PR branch.
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        # Pipeline lives in phenomenon-configs; fixes on the same major arrive automatically.
        uses: Phenomenon-Studio/phenomenon-configs/.github/workflows/node-ci.yml@v1

    # Story tests (play functions + axe a11y) in Vitest browser mode, a required pre-merge check on `main`.
    # Separate job: the shared pipeline doesn't install Playwright browsers.
    storybook:
        name: storybook tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # ignoreScripts (pnpm-workspace.yaml) skips Playwright's postinstall; fetch Chromium explicitly.
            - run: pnpm exec playwright install --with-deps chromium

            - run: pnpm test:storybook

    # Visual review on Chromatic, a required pre-merge check on `main`. Billed per snapshot: only `Matrix` stories
    # snapshot (`.storybook/preview.tsx`), and TurboSnap (`onlyChanged` in chromatic.config.json) skips stories whose
    # dependencies didn't change.
    chromatic:
        name: chromatic
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Dependabot PRs have no access to secrets.
        if: github.actor != 'dependabot[bot]'
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  # TurboSnap needs git history to find the baseline build.
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - uses: chromaui/action@9cb4d65a86fe1c4c67a76a8d90f35a51a118e55f # v18.15.1
              with:
                  projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
                  # Unreviewed visual changes fail the job, so the PR can't merge until someone accepts them in
                  # Chromatic (then re-run this job). Denied changes stay red.
                  exitZeroOnChanges: false
                  # Merged changes become the new baseline.
                  autoAcceptChanges: main
